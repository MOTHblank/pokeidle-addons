[package]
name = "moth-controller"
version = "0.1.4"
edition = "2024"
description = "Native Windows and Linux controller for dedicated PokéIdle browser profiles"

[[bin]]
name = "moth-controller"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "links", "x11", "wayland"] }
serde_json = "1.0"
tungstenite = "0.30"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
