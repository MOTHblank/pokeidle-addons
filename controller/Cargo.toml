[package]
name = "moth-controller"
version = "0.1.7-native.18"
edition = "2024"
description = "Native Windows and Linux controller for dedicated PokéIdle browser profiles"

[[bin]]
name = "moth-controller"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "links", "x11", "wayland"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
