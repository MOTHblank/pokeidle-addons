[package]
name = "moth-controller"
version = "0.1.0"
edition = "2024"
description = "Native Windows controller for dedicated PokéIdle browser profiles"

[[bin]]
name = "moth-controller"
path = "src/main.rs"

[dependencies]
native-windows-gui = "1.0.13"
winapi = { version = "0.3.9", features = ["winuser"] }
serde_json = "1.0"
tungstenite = "0.30"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
