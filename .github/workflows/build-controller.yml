name: Publicar release v0.1.7 (Windows e Linux)

# Only run this workflow when explicitly requested.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-release-v0.1.7
  cancel-in-progress: false

jobs:
  validar:
    name: Conferir versão e notas
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Verificar a versão do Cargo
        shell: bash
        run: |
          set -euo pipefail
          versao="$(grep -m1 '^version = ' controller/Cargo.toml | cut -d '"' -f 2)"
          test "$versao" = "0.1.7" || { echo "Cargo.toml deve estar em 0.1.7, não $versao"; exit 1; }
          test -s .github/release-notes/v0.1.7.md || { echo "Notas de lançamento ausentes"; exit 1; }

  windows:
    name: Windows x86_64
    needs: validar
    runs-on: windows-2022
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Instalar Rust estável
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: controller -> target

      - name: Executar testes Rust
        working-directory: controller
        run: cargo test --locked

      - name: Compilar release Windows
        working-directory: controller
        run: cargo build --release --locked

      - name: Preparar executável e SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $arquivo = 'moth-controller-v0.1.7-windows-x86_64.exe'
          Copy-Item 'controller/target/release/moth-controller.exe' "dist/$arquivo"
          $hash = (Get-FileHash "dist/$arquivo" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $arquivo" | Set-Content -Encoding ascii "dist/$arquivo.sha256"

      - name: Enviar artefato Windows
        uses: actions/upload-artifact@v4
        with:
          name: moth-controller-v0.1.7-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x86_64
    needs: validar
    runs-on: ubuntu-22.04
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Instalar dependências do Linux
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libgtk-3-dev libudev-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxkbcommon-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libsqlite3-dev

      - name: Instalar Rust estável
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: controller -> target

      - name: Executar testes Rust
        working-directory: controller
        run: cargo test --locked

      - name: Compilar release Linux
        working-directory: controller
        run: cargo build --release --locked

      - name: Preparar arquivo Linux e SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist pacote
          install -m755 controller/target/release/moth-controller pacote/moth-controller
          cp .github/release-notes/LEIA-ME-LINUX.md pacote/LEIA-ME-LINUX.md
          install -m755 controller/linux/check-linux-deps.sh pacote/check-linux-deps.sh
          arquivo=moth-controller-v0.1.7-linux-x86_64.tar.gz
          tar -czf "dist/$arquivo" -C pacote moth-controller check-linux-deps.sh LEIA-ME-LINUX.md
          (cd dist && sha256sum "$arquivo" > "$arquivo.sha256")

      - name: Enviar artefato Linux
        uses: actions/upload-artifact@v4
        with:
          name: moth-controller-v0.1.7-linux
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publicar:
    name: Publicar release após validação
    needs: [validar, windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Obter notas de lançamento
        uses: actions/checkout@v4

      - name: Baixar os dois pacotes
        uses: actions/download-artifact@v4
        with:
          pattern: moth-controller-v0.1.7-*
          path: dist
          merge-multiple: true

      - name: Conferir arquivos e checksums
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/moth-controller-v0.1.7-windows-x86_64.exe
          test -s dist/moth-controller-v0.1.7-linux-x86_64.tar.gz
          (cd dist && for arquivo in *.sha256; do sed -i 's/\r$//' "$arquivo"; done && sha256sum -c ./*.sha256)

      - name: Publicar v0.1.7 somente após testes e checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v0.1.7
          notas=.github/release-notes/v0.1.7.md
          titulo='Moth Controller v0.1.7 — Windows e Linux'
          # A Windows-only tag may already exist. Attach ONLY a missing Linux
          # artifact; never overwrite either platform's published binaries.
          if gh release view "$tag" >/dev/null 2>&1; then
            linux=moth-controller-v0.1.7-linux-x86_64.tar.gz
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$linux"; then
              echo "O pacote Linux já existe em $tag; nenhum arquivo foi sobrescrito."
              exit 0
            fi
            gh release upload "$tag" "dist/$linux" "dist/$linux.sha256"
            echo "Pacote Linux adicionado à release existente $tag."
            exit 0
          fi
          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "$titulo" --notes-file "$notas"
          echo "Release $tag publicada com Windows, Linux e checksums."
