name: Build e release do Moth Controller (Windows e Linux)

on:
  # Release da nova versão por alteração do Cargo.toml em master.
  # Mudanças no lockfile e notas também reexecutam builds pendentes.
  # O envio da tag correspondente pode iniciar a publicação; o token não
  # dispara uma segunda execução quando a release cria a tag.
  push:
    branches: [master]
    paths:
      - 'controller/Cargo.toml'
      - 'controller/Cargo.lock'
      - 'controller/src/**'
      - '.github/release-notes/v*.md'
      # Permite nova tentativa quando corrigimos o workflow de uma release pendente.
      - '.github/workflows/build-controller.yml'
    tags:
      - 'v*.*.*'
  # Execução manual gera artefatos; publicação é opcional e só no master.
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publicar a release da versão atual (somente master)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: controller-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versao:
    name: Conferir versão e modo de publicação
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      publish: ${{ steps.metadata.outputs.publish }}
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Conferir Cargo.toml e tag
        id: metadata
        shell: bash
        env:
          REQUEST_PUBLISH: ${{ inputs.publish_release || false }}
          PREVIOUS_MASTER_SHA: ${{ github.event.before || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version = "' controller/Cargo.toml | cut -d '"' -f 2)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::A versão do Cargo.toml deve seguir X.Y.Z: $version"
            exit 1
          fi
          tag="v$version"
          publish=false

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME não corresponde ao Cargo.toml ($tag)"
              exit 1
            fi
            publish=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/master ]]; then
            # Uma edição de metadata sem aumento da versão não publica release.
            if [[ ! "$PREVIOUS_MASTER_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Não foi possível determinar o commit anterior."
              exit 1
            fi
            git fetch --no-tags --depth=1 origin "$PREVIOUS_MASTER_SHA"
            previous="$(git show "$PREVIOUS_MASTER_SHA:controller/Cargo.toml" | grep -m1 '^version = "' | cut -d '"' -f 2)"
            if [[ "$version" != "$previous" ]]; then
              echo "Versão alterada: $previous -> $version. Publicação habilitada."
              publish=true
            elif gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag já existe; apenas validando os binários."
            else
              # Um ajuste ao workflow permite recuperar a publicação depois
              # de uma execução que falhou, sem inventar uma nova versão.
              echo "Release $tag ainda não publicada; nova tentativa habilitada."
              publish=true
            fi
          elif [[ "$REQUEST_PUBLISH" == true ]]; then
            if [[ "$GITHUB_REF" != refs/heads/master ]]; then
              echo "::error::Publicação manual só é permitida a partir de master."
              exit 1
            fi
            publish=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Versão $tag; publicar=$publish"

  windows:
    name: Windows x86_64
    needs: versao
    # After publication, source changes are covered by the validation workflow.
    # Manual dispatch still produces preview binaries when publishing is disabled.
    if: needs.versao.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Instalar Rust estável
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: controller -> target

      - name: Executar testes
        working-directory: controller
        run: cargo test --locked

      - name: Compilar release
        working-directory: controller
        run: cargo build --release --locked

      - name: Preparar executável e SHA-256
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.versao.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $arquivo = "moth-controller-v$($env:RELEASE_VERSION)-windows-x86_64.exe"
          Copy-Item 'controller/target/release/moth-controller.exe' "dist/$arquivo"
          $hash = (Get-FileHash "dist/$arquivo" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $arquivo" | Set-Content -Encoding ascii "dist/$arquivo.sha256"

      - name: Atestar proveniência do executável Windows
        uses: actions/attest@v4
        with:
          subject-path: dist/*.exe

      - name: Enviar artefato Windows
        uses: actions/upload-artifact@v4
        with:
          name: moth-controller-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux x86_64 (glibc 2.35)
    needs: versao
    if: needs.versao.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Instalar dependências Linux
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libgtk-3-dev libudev-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxkbcommon-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libsqlite3-0 zip

      - name: Instalar Rust estável
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: controller -> target

      - name: Executar testes
        working-directory: controller
        run: cargo test --locked

      - name: Compilar release
        working-directory: controller
        run: cargo build --release --locked

      - name: Verificar bibliotecas compartilhadas
        shell: bash
        run: |
          set -euo pipefail
          ldd controller/target/release/moth-controller | tee /tmp/moth-controller-ldd.txt
          if grep -q 'not found' /tmp/moth-controller-ldd.txt; then
            echo "::error::O executável Linux tem dependências ausentes"
            exit 1
          fi

      - name: Preparar ZIP Linux e SHA-256
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.versao.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/package
          install -m755 controller/target/release/moth-controller dist/package/moth-controller
          install -m755 controller/linux/check-linux-deps.sh dist/package/check-linux-deps.sh
          cp .github/release-notes/LEIA-ME-LINUX.md dist/package/LEIA-ME-LINUX.md
          cp LICENSE dist/package/LICENSE.txt
          arquivo="moth-controller-v$RELEASE_VERSION-linux-x86_64.zip"
          (cd dist/package && zip -q "../$arquivo" moth-controller check-linux-deps.sh LEIA-ME-LINUX.md LICENSE.txt)
          (cd dist && sha256sum "$arquivo" > "$arquivo.sha256")

      - name: Atestar proveniência do pacote Linux
        uses: actions/attest@v4
        with:
          subject-path: dist/*.zip

      - name: Enviar artefato Linux
        uses: actions/upload-artifact@v4
        with:
          name: moth-controller-linux
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  publicar:
    name: Publicar GitHub Release
    needs: [versao, windows, linux]
    if: needs.versao.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Obter código e notas
        uses: actions/checkout@v4

      - name: Baixar binários Windows e Linux
        uses: actions/download-artifact@v4
        with:
          pattern: moth-controller-*
          path: dist
          merge-multiple: true

      - name: Conferir binários e checksums
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.versao.outputs.version }}
        run: |
          set -euo pipefail
          test -s "dist/moth-controller-v$RELEASE_VERSION-windows-x86_64.exe"
          test -s "dist/moth-controller-v$RELEASE_VERSION-linux-x86_64.zip"
          (cd dist && for checksum in *.sha256; do sed -i 's/\r$//' "$checksum"; done && sha256sum -c ./*.sha256)
          cp LICENSE dist/LICENSE.txt

      - name: Publicar sem sobrescrever versões existentes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.versao.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag já existe. Atualize a versão antes de publicar outra release."
            exit 1
          fi

          # A deleted release can leave its old Git tag in place. Release
          # assets are built from this run, so the tag MUST point to this
          # exact source revision (including hotfixes), not a stale binary.
          latest_master="$(gh api "repos/$GITHUB_REPOSITORY/branches/master" --jq '.commit.sha')"
          if [[ "$GITHUB_SHA" != "$latest_master" ]]; then
            echo "::error::Master advanced after this build; refusing to publish a stale release."
            exit 1
          fi
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null || true)"
          if [[ -n "$tag_sha" && "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "Moving unpublished $tag from $tag_sha to $GITHUB_SHA"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          fi

          notes=".github/release-notes/$tag.md"
          title="Moth Controller $tag — Windows e Linux"
          if [[ -s "$notes" ]]; then
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "$title" --notes-file "$notes"
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "$title" --generate-notes
          fi
          echo "Release $tag publicada com Windows, Linux, licença e checksums."
