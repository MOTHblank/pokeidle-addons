name: Validate native Moth Controller (Windows e Linux)

# Run checks on relevant changes; produce downloadable preview binaries manually.
on:
  push:
    branches: [master]
    paths:
      - 'controller/**'
      - '.github/workflows/**'
  pull_request:
    branches: [master]
    paths:
      - 'controller/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-prototype:
    name: Check controller / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: controller -> target
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libgtk-3-dev libudev-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxkbcommon-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libsqlite3-0
      - name: Test native controller
        working-directory: controller
        run: cargo test --locked
      - name: Check native controller
        working-directory: controller
        run: cargo check --locked
      - name: Build Windows binary for installer validation
        if: runner.os == 'Windows'
        working-directory: controller
        run: cargo build --locked
      - name: Validate Windows installer packaging
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }

          $match = Select-String -Path 'controller/Cargo.toml' -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          if (-not $match) { throw 'Could not read controller version' }
          $version = $match.Matches[0].Groups[1].Value
          $controller = (Resolve-Path 'controller/target/debug/moth-controller.exe').Path

          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($controller)
          $iconPath = Join-Path $env:RUNNER_TEMP 'moth-controller-validation.ico'
          $stream = [System.IO.File]::Create($iconPath)
          try { $icon.Save($stream) } finally { $stream.Dispose(); $icon.Dispose() }

          $output = Join-Path $env:RUNNER_TEMP 'moth-installer-validation'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          & $iscc "/DAppVersion=$version" "/DControllerExe=$controller" "/DControllerIcon=$iconPath" "/O$output" 'controller/windows/moth-controller.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup validation failed with exit code $LASTEXITCODE" }
          $installer = Join-Path $output "Moth-Controller-Setup-v$version.exe"
          if (-not (Test-Path $installer)) { throw "Expected installer was not generated: $installer" }
      - name: Build native preview (manual only)
        if: github.event_name == 'workflow_dispatch'
        working-directory: controller
        run: cargo build --release --locked
      - name: Upload Windows preview (branch only)
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: moth-native-preview-windows
          path: controller/target/release/moth-controller.exe
          if-no-files-found: error
      - name: Check Linux shared-library links
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        shell: bash
        run: |
          ldd controller/target/release/moth-controller | tee /tmp/moth-linux-ldd.txt
          if grep -q 'not found' /tmp/moth-linux-ldd.txt; then
            echo 'Linux release has unresolved shared libraries'
            exit 1
          fi
      - name: Package Linux preview
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          install -m755 controller/target/release/moth-controller dist/package/moth-controller
          install -m755 controller/linux/check-linux-deps.sh dist/package/check-linux-deps.sh
          cp .github/release-notes/LEIA-ME-LINUX.md dist/package/LEIA-ME-LINUX.md
          cp LICENSE dist/package/LICENSE.txt
          file=moth-native-preview-linux-x86_64.tar.gz
          tar -czf "dist/$file" -C dist/package moth-controller check-linux-deps.sh LEIA-ME-LINUX.md LICENSE.txt
          (cd dist && sha256sum "$file" > "$file.sha256")
      - name: Upload Linux preview (manual workflow)
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: moth-native-preview-linux
          path: |
            dist/moth-native-preview-linux-x86_64.tar.gz
            dist/moth-native-preview-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
